bundle:
  name: sap_bdc_publisher

variables:
  project_name:
    description: "Solution accelerator name"
    default: "sap-bdc-publisher"

  environment:
    description: "Deployment environment (dev, staging, prod)"
    default: "dev"

  warehouse_id:
    description: "SQL warehouse for the AI/BI dashboard. Override with --var warehouse_id=<id>."
    lookup:
      warehouse: "Serverless Starter Warehouse"

  activity_catalog:
    description: "Catalog of the app's activity log table (used by the AI/BI dashboard)"
    default: "main"

  activity_schema:
    description: "Schema of the app's activity log table; the table itself must be named 'activity'"
    default: "bdc_sharing"

targets:
  dev:
    default: true
    mode: development
    presets:
      source_linked_deployment: false

resources:
  apps:
    bdc_sharing_app:
      name: "bdc-sharing"
      description: "Publish Unity Catalog shares to SAP Business Data Cloud"
      source_code_path: "./apps/bdc-sharing"
      user_api_scopes:
        - sql

  dashboards:
    bdc_sharing_dashboard:
      display_name: "SAP BDC sharing"
      file_path: "./apps/bdc-sharing/dashboards/bdc_sharing.lvdash.json"
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.activity_catalog}
      dataset_schema: ${var.activity_schema}
      # Viewers query with their own permissions, so information_schema and
      # the audit log show only what each viewer may see.
      embed_credentials: false

  jobs:
    deploy_bdc_sharing_app:
      name: "${var.project_name} - Deploy bdc-sharing app source"
      tasks:
        - task_key: deploy
          notebook_task:
            notebook_path: "./notebooks/deploy_app.py"
            base_parameters:
              app_name: "bdc-sharing"
              source_code_path: "${workspace.file_path}/apps/bdc-sharing"
          environment_key: bdc_env
      environments:
        - environment_key: bdc_env
          spec:
            client: "2"
            dependencies: []
