<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Documentation — Data Sharing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .docs { padding: var(--space-6) 40px; }
</style>
</head>
<body>
<header class="header">
  <div class="brand">
    <img class="brand-logo" src="/img/databricks.svg" alt="Databricks">
    <div><div class="brand-name">Data Sharing <span class="brand-sub">Documentation</span></div></div>
  </div>
  <div class="header-actions">
    <a href="/">← Back to app</a>
    <a href="/README.md" target="_blank">View raw</a>
  </div>
</header>
<main class="main narrow">
  <div id="docs" class="card prose docs"><div class="empty"><span class="loading"></span> Loading documentation…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(async function() {
  try {
    const res = await fetch('/README.md', { credentials: 'include' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    document.getElementById('docs').innerHTML = marked.parse(md, { gfm: true, breaks: false });
  } catch (e) {
    document.getElementById('docs').innerHTML =
      '<div class="msg err">Failed to load documentation: ' + String(e.message || e).replace(/</g, '&lt;') + '</div>';
  }
})();
</script>
</body>
</html>
