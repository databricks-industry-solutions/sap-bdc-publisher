<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Sharing: Databricks to SAP BDC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <img class="brand-logo" src="/img/databricks.svg" alt="Databricks">
      <div><div class="brand-name">Data Sharing <span class="brand-sub">Databricks → SAP BDC</span></div></div>
    </div>
    <div class="header-actions">
      <a href="/" class="active">Publish</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/activity.html">Activity</a>
      <a href="/setup.html">Setup</a>
      <a href="/faq.html">FAQ</a>
      <a href="/docs.html" target="_blank">Documentation</a>
      <div id="user-badge" class="user-badge"></div>
    </div>
  </header>

  <main class="main">
    <section class="welcome welcome-flow">
      <div>
        <h1 id="welcome-title">Publish shares to SAP BDC</h1>
        <p>Pick a share, pick a BDC connection, publish. You only see shares and connections you can access in Unity Catalog. <a href="/faq.html#how-it-works">How it works</a></p>
        <div id="compute"></div>
      </div>
      <a class="flow" href="/faq.html#how-it-works" aria-label="How it works: Databricks shares data with SAP BDC through OpenSharing">
        <span class="flow-node"><span class="flow-icon"><img src="/img/databricks.svg" alt=""></span>Databricks</span>
        <span class="flow-line" aria-hidden="true"></span>
        <span class="flow-node"><span class="flow-icon round"><img src="/img/opensharing.png" alt=""></span>OpenSharing</span>
        <span class="flow-line" aria-hidden="true"></span>
        <span class="flow-node"><span class="flow-icon"><img src="/img/sap.svg" alt="" class="wide"></span>SAP BDC</span>
      </a>
    </section>

    <div id="setup-banner" class="banner"></div>
    <div id="banner" class="banner"></div>

    <section class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Filter shares…" aria-label="Filter shares" />
        <label><input type="checkbox" id="show-all" /> Include shares I don't own</label>
        <button class="btn secondary btn-sm" id="refresh" type="button">Refresh</button>
      </div>
      <div id="shares-msg"></div>
      <div id="shares"></div>
    </section>
  </main>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <button class="close" id="panel-close" type="button" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </div>
</div>

<script src="/common.js"></script>
<script>
const { api, escHtml, errorBox, fmtDate } = window.BDC;
const PK_PAGE_SIZE = 10;
const SAP_HELP = 'https://help.sap.com/docs/business-data-cloud';

const state = {
  wh: null,
  overview: null,
  pending: [],
  lastPub: new Map(),   // shareName -> ISO date of last successful publish
  showAll: false,
  search: '',
  panel: null,
  pollTimer: null,
};

function el(id) { return document.getElementById(id); }

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

(async function boot() {
  BDC.renderUserBadge('user-badge');
  el('search').oninput = (e) => { state.search = e.target.value.toLowerCase(); renderShares(); };
  el('show-all').onchange = (e) => { state.showAll = e.target.checked; renderShares(); };
  el('refresh').onclick = () => loadShares(true);
  el('panel-close').onclick = closePanel;
  el('overlay').addEventListener('click', (e) => { if (e.target === el('overlay')) closePanel(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !el('overlay').hidden) closePanel(); });
  el('shares').innerHTML = '<div class="empty"><span class="loading"></span> Waiting for compute…</div>';
  BDC.mountCompute(el('compute'), onWarehouseReady);
})();

async function onWarehouseReady(id) {
  state.wh = id;
  // Finish any REVOKE left over from a delete whose tab was closed, then
  // list shares. All independent; run them together.
  await Promise.allSettled([checkSetup(), finalizePending(), loadShares(false), loadLastPublished()]);
}

// Publishing is blocked server-side until the required setup checks pass.
// Show that up front instead of letting the user hit it in the panel.
async function checkSetup() {
  try {
    const r = await api('GET', '/api/setup/readiness?warehouseId=' + encodeURIComponent(state.wh));
    state.setup = r;
    const failed = r.checks.filter((c) => c.level === 'required' && c.status !== 'ok');
    const html = failed.length
      ? '<div class="msg ' + (r.enforced ? 'err' : 'warn') + '"><strong>' + (r.enforced ? 'Finish setup before publishing.' : 'Setup incomplete.') + '</strong> ' +
        failed.map((c) => escHtml(c.label) + ': ' + escHtml(c.detail)).join(' ') +
        ' <a class="btn secondary btn-sm" href="/setup.html">Open Setup</a></div>'
      : '';
    el('setup-banner').innerHTML = html;
    if (state.overview) renderShares();
  } catch (e) {
    el('setup-banner').innerHTML = errorBox('Could not check setup:', e);
  }
}

function setupBlocked() {
  const r = state.setup;
  return !!(r && r.enforced && !r.ready);
}

async function finalizePending() {
  try {
    const p = await api('GET', '/api/unpublish/pending?warehouseId=' + encodeURIComponent(state.wh));
    state.pending = p.pending || [];
    if (!state.pending.length) return;
    renderBanner('<div class="msg info"><span class="loading"></span> Finishing ' + state.pending.length + ' removal(s) from an earlier session…</div>');
    const r = await api('POST', '/api/unpublish/finalize-pending', { warehouseId: state.wh });
    const done = (r.results || []).filter((x) => x.ok);
    const failed = (r.results || []).filter((x) => !x.ok);
    let html = '';
    if (done.length) {
      html += '<div class="msg ok"><strong>Finished ' + done.length + ' removal(s).</strong> The SELECT grant was revoked for: ' +
        done.map((d) => '<code>' + escHtml(d.shareName) + '</code> → <code>' + escHtml(d.recipientName) + '</code>').join(', ') + '.</div>';
    }
    if (failed.length) {
      html += '<div class="msg err"><strong>' + failed.length + ' removal(s) still need a REVOKE.</strong> BDC no longer lists them, but the grant is still in place.<ul>' +
        failed.map((f) => '<li><code>' + escHtml(f.shareName) + '</code> → <code>' + escHtml(f.recipientName) + '</code>: ' + escHtml(f.error) + '</li>').join('') +
        '</ul><button class="btn secondary btn-sm" id="retry-revoke" type="button">Retry</button></div>';
    }
    state.pending = failed.map((f) => ({ shareName: f.shareName, recipientName: f.recipientName }));
    renderBanner(html);
    const b = el('retry-revoke'); if (b) b.onclick = finalizePending;
    if (done.length) loadShares(true);
  } catch (e) {
    renderBanner(errorBox('Could not finish earlier removals:', e, 'retry-revoke'));
    const b = el('retry-revoke'); if (b) b.onclick = finalizePending;
  }
}

function renderBanner(html) { el('banner').innerHTML = html || ''; }

async function loadShares(refresh) {
  el('shares-msg').innerHTML = '';
  if (!state.overview) el('shares').innerHTML = '<div class="empty"><span class="loading"></span> Loading shares…</div>';
  else el('refresh').disabled = true;
  try {
    state.overview = await api('GET', '/api/shares?warehouseId=' + encodeURIComponent(state.wh) + (refresh ? '&refresh=1' : ''));
    renderShares();
    openFromUrl();
  } catch (e) {
    el('shares-msg').innerHTML = errorBox('Could not list shares:', e, 'shares-retry');
    el('shares-retry').onclick = () => loadShares(true);
    if (!state.overview) el('shares').innerHTML = '';
  } finally {
    el('refresh').disabled = false;
  }
}

async function loadLastPublished() {
  try {
    const r = await api('GET', '/api/activity/last-published?warehouseId=' + encodeURIComponent(state.wh));
    state.lastPub = new Map((r.shares || []).map((x) => [x.shareName, x.at]));
    if (state.overview) renderShares();
  } catch { /* optional column */ }
}

// ---------------------------------------------------------------------------
// Shares table
// ---------------------------------------------------------------------------

function pendingFor(shareName) {
  return state.pending.filter((p) => p.shareName === shareName);
}

function renderShares() {
  const ov = state.overview;
  if (!ov) return;
  const conns = ov.connections || [];
  const visible = ov.shares.filter((s) => (state.showAll || s.isOwner) &&
    (!state.search || s.name.toLowerCase().includes(state.search) || String(s.comment || '').toLowerCase().includes(state.search)));

  const notes = [];
  if (!conns.length) {
    notes.push('<div class="msg warn">No BDC connections are visible to you. In SAP BDC, a connection to this workspace creates a Delta Sharing recipient (named <code>bdc-connect-…</code>). Ask the recipient owner to give you <code>USE RECIPIENT</code>, or see the <a href="/faq.html#connections">FAQ</a>.</div>');
  }
  if (ov.source === 'show_commands') {
    notes.push('<div class="msg info">information_schema was not readable on this warehouse, so the app fell back to slower SHOW commands.</div>');
  }
  const hiddenNotOwned = ov.shares.filter((s) => !s.isOwner).length;
  if (!state.showAll && hiddenNotOwned) {
    notes.push('<div class="muted mb-2">' + hiddenNotOwned + ' share(s) you don\'t own are hidden. Publishing those needs <code>USE SHARE</code> and <code>SET SHARE PERMISSION</code>.</div>');
  }
  el('shares-msg').innerHTML = notes.join('');

  if (!visible.length) {
    el('shares').innerHTML = '<div class="empty">' + (ov.shares.length ? 'No shares match the filter.' : 'No shares are visible to you. Create a share in Catalog Explorer first.') + '</div>';
    return;
  }

  const rows = visible.map((s) => {
    const pend = pendingFor(s.name);
    const connsHtml = s.bdcConnections.length
      ? s.bdcConnections.map((c) =>
          '<div class="conn"><code title="' + escHtml(c.name) + '">' + escHtml(shortConn(c.name)) + '</code>' +
          '<button class="btn link btn-sm" data-act="republish" data-share="' + escHtml(s.name) + '" data-conn="' + escHtml(c.name) + '" type="button">Update in BDC</button>' +
          '<button class="btn link btn-sm" data-act="unpublish" data-share="' + escHtml(s.name) + '" data-conn="' + escHtml(c.name) + '" type="button">Unpublish</button>' +
          '</div>').join('')
      : '<span class="muted">—</span>';
    let status = '<span class="status">Not in BDC</span>';
    if (pend.length) status = '<span class="status pending">Revoke pending</span> <button class="btn link btn-sm" data-act="finish" type="button">Finish</button>';
    else if (s.bdcConnections.length) status = '<span class="status in-bdc">In BDC</span>';
    const unpublishedConns = conns.filter((c) => !s.bdcConnections.some((b) => b.name === c.name));
    const publishBtn = unpublishedConns.length
      ? '<button class="btn ' + (s.isOwner ? 'primary' : 'secondary') + ' btn-sm" data-act="publish" data-share="' + escHtml(s.name) + '" type="button">Publish…</button>'
      : '';
    return '<tr>' +
      '<td><div class="share-name">' + escHtml(s.name) + '</div>' +
        '<div class="muted">' + (s.isOwner ? 'You own this' : 'Owner: ' + escHtml(s.owner || '?')) + (s.comment ? ' · ' + escHtml(s.comment) : '') + '</div></td>' +
      '<td class="num">' + (s.tableCount == null ? '—' : escHtml(s.tableCount)) + '</td>' +
      '<td>' + connsHtml + '</td>' +
      '<td>' + fmtDate(state.lastPub.get(s.name)) + '</td>' +
      '<td>' + status + '</td>' +
      '<td class="actions-cell">' + publishBtn + '</td>' +
      '</tr>';
  }).join('');

  el('shares').innerHTML =
    '<table class="grid"><thead><tr><th>Share</th><th class="num">Tables</th><th>BDC connections</th><th>Last published</th><th>Status</th><th></th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<div class="muted mt-3">' + visible.length + ' of ' + ov.shares.length + ' share(s) · ' + conns.length + ' BDC connection(s)' +
    (ov.cachedAgeMs != null ? ' · loaded ' + Math.round(ov.cachedAgeMs / 1000) + 's ago' : '') + '</div>';

  el('shares').querySelectorAll('[data-act]').forEach((b) => {
    if (setupBlocked() && b.getAttribute('data-act') !== 'finish') { b.disabled = true; b.title = 'Finish setup first'; return; }
    b.onclick = () => {
      const act = b.getAttribute('data-act');
      if (act === 'finish') return finalizePending();
      openPanel(act, b.getAttribute('data-share'), b.getAttribute('data-conn'));
    };
  });
}

// Deep links from the Dashboard: /?act=republish&share=…&conn=…
function openFromUrl() {
  const q = new URLSearchParams(location.search);
  const act = q.get('act'); const share = q.get('share');
  if (!act || !share || !['publish', 'republish', 'unpublish'].includes(act)) return;
  history.replaceState(null, '', '/');
  const s = state.overview.shares.find((x) => x.name === share);
  if (!s) return;
  state.showAll = state.showAll || !s.isOwner;
  el('show-all').checked = state.showAll;
  renderShares();
  openPanel(act, share, q.get('conn'));
}

function shortConn(name) {
  return name.length > 34 ? name.slice(0, 22) + '…' + name.slice(-8) : name;
}

// ---------------------------------------------------------------------------
// Panel: publish / update / unpublish
// ---------------------------------------------------------------------------

function openPanel(mode, shareName, connName) {
  const share = state.overview.shares.find((s) => s.name === shareName);
  const conns = state.overview.connections || [];
  let connection = connName || null;
  if (mode === 'publish' && !connection) {
    const open = conns.filter((c) => !share.bdcConnections.some((b) => b.name === c.name));
    if (open.length === 1) connection = open[0].name;
  }
  state.panel = {
    mode, share, connection,
    detail: null, detailError: null,
    preflight: null, preflightError: null, preflightRunning: false,
    pkSel: {}, pkUi: {},
    run: null, phase: 'form',
    form: { title: shareName, short: '', long: 'Published from Data Sharing app: ' + shareName },
  };
  el('overlay').hidden = false;
  renderPanel();
  if (mode !== 'unpublish') loadDetail();
}

function closePanel() {
  if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
  const p = state.panel;
  state.panel = null;
  el('overlay').hidden = true;
  if (p && p.run) loadShares(true);
}

async function loadDetail(refresh) {
  const p = state.panel;
  try {
    p.detail = await api('GET', '/api/shares/' + encodeURIComponent(p.share.name) + '?warehouseId=' + encodeURIComponent(state.wh) + (refresh ? '&refresh=1' : ''));
    if (state.panel !== p) return;
    renderPanel();
    if (p.connection) runPreflight();
  } catch (e) {
    p.detailError = e;
    renderPanel();
  }
}

async function runPreflight(refresh) {
  const p = state.panel;
  if (!p || !p.connection || !p.detail) return;
  p.preflightRunning = true; p.preflightError = null;
  renderPanel();
  try {
    const r = await api('POST', '/api/preflight', {
      shareName: p.share.name, recipientName: p.connection, warehouseId: state.wh,
      primaryKeys: selectedPks(p), refresh: !!refresh,
    });
    if (state.panel !== p) return;
    p.preflight = r;
  } catch (e) {
    p.preflightError = e;
  } finally {
    p.preflightRunning = false;
    if (state.panel === p) renderPanel();
  }
}

function selectedPks(p) {
  const out = {};
  for (const [k, v] of Object.entries(p.pkSel)) if (v && v.length) out[k] = v;
  return out;
}

// The PK check is recomputed locally so it turns green as soon as the user
// picks columns, without another server round trip.
function effectiveChecks(p) {
  if (!p.preflight) return [];
  return p.preflight.checks.map((c) => {
    if (c.id !== 'pk' || !p.detail) return c;
    if (p.detail.columnsError || p.detail.tables.some((t) => t.columnsKnown === false)) return c;
    const missing = p.detail.tables.filter((t) => !t.hasPrimaryKey && !(p.pkSel[t.sharedAs] || []).length);
    if (!missing.length) return { ...c, status: 'ok', detail: 'Every table has a key from Unity Catalog or from your selection.' };
    return { ...c, status: 'warn', detail: missing.length + ' table(s) without a primary key: ' + missing.map((t) => t.sharedAs).join(', ') + '. BDC expects a key per entity. Pick key columns below, or publish without.' };
  });
}

function renderPanel() {
  const p = state.panel;
  if (!p) return;
  const body = el('panel-body');
  if (p.mode === 'unpublish') { body.innerHTML = renderUnpublish(p); wireUnpublish(p); return; }

  const title = p.mode === 'republish' ? 'Update in BDC' : 'Publish to SAP BDC';
  let html = '<h2 id="panel-title">' + title + '</h2>' +
    '<div class="muted">Share <code>' + escHtml(p.share.name) + '</code></div>';

  if (p.phase !== 'form') {
    body.innerHTML = html + renderRunState(p);
    wireRunState(p);
    return;
  }

  // Connection
  const conns = state.overview.connections || [];
  if (p.mode === 'republish') {
    html += '<div class="section"><h3>BDC connection</h3><code>' + escHtml(p.connection) + '</code>' +
      '<div class="muted mt-1">Re-sends the metadata and schema to BDC and publishes again. The grant on the share stays as it is.</div></div>';
  } else {
    const open = conns.filter((c) => !p.share.bdcConnections.some((b) => b.name === c.name));
    html += '<div class="section"><h3>BDC connection</h3>' +
      (open.length === 1
        ? '<code>' + escHtml(open[0].name) + '</code> <span class="badge">' + escHtml(open[0].authenticationType || '') + '</span>'
        : '<select id="conn-select"><option value="">Select a BDC connection…</option>' +
          open.map((c) => '<option value="' + escHtml(c.name) + '"' + (c.name === p.connection ? ' selected' : '') + '>' + escHtml(c.name) + ' (' + escHtml(c.authenticationType || '?') + ')</option>').join('') +
          '</select>') +
      '</div>';
  }

  // Objects
  if (p.detailError) {
    html += '<div class="section">' + errorBox('Could not load the share:', p.detailError, 'detail-retry') + '</div>';
  } else if (!p.detail) {
    html += '<div class="section muted"><span class="loading"></span> Loading tables…</div>';
  } else {
    const types = {};
    p.detail.objects.forEach((o) => { types[o.dataObjectType] = (types[o.dataObjectType] || 0) + 1; });
    html += '<div class="section"><h3>Contents</h3><div class="muted">' +
      Object.entries(types).map(([t, n]) => n + ' ' + escHtml(t.toLowerCase().replace('_', ' ')) + (n === 1 ? '' : 's')).join(', ') +
      '</div></div>';
  }

  // Pre-flight
  html += '<div class="section"><h3>Pre-flight checks</h3>' + renderPreflight(p) + '</div>';

  // PK picker (only when needed)
  if (p.detail) html += renderPkSection(p);

  // Metadata
  html += '<div class="section"><h3>Data product</h3><div class="metadata-grid">' +
    '<div><label>Title</label><input id="md-title" value="' + escHtml(p.form.title) + '" /></div>' +
    '<div><label>Short description <span class="required">*</span></label>' +
    '<input id="md-short" value="' + escHtml(p.form.short) + '" placeholder="One line, without the title" />' +
    '<div id="md-short-err" class="field-err" hidden></div></div>' +
    '<div><label>Description</label><textarea id="md-long" rows="2">' + escHtml(p.form.long) + '</textarea></div>' +
    '</div></div>';

  const checks = effectiveChecks(p);
  const blocked = !p.preflight || p.preflightRunning || checks.some((c) => c.status === 'fail');
  html += '<div class="actions">' +
    '<button id="btn-go" class="btn primary" type="button"' + (blocked ? ' disabled' : '') + '>' + (p.mode === 'republish' ? 'Update in BDC' : 'Publish') + '</button>' +
    '<button id="btn-cancel" class="btn secondary" type="button">Cancel</button>' +
    '</div>';
  body.innerHTML = html;

  const cs = el('conn-select');
  if (cs) cs.onchange = () => { p.connection = cs.value || null; p.preflight = null; renderPanel(); runPreflight(); };
  const dr = el('detail-retry'); if (dr) dr.onclick = () => { p.detailError = null; renderPanel(); loadDetail(); };
  const pr = el('preflight-retry'); if (pr) pr.onclick = () => runPreflight(true);
  const pkr = el('pk-retry'); if (pkr) pkr.onclick = () => { p.detail = null; p.preflight = null; renderPanel(); loadDetail(true); };
  ['md-title', 'md-short', 'md-long'].forEach((id) => {
    el(id).oninput = () => { p.form.title = el('md-title').value; p.form.short = el('md-short').value; p.form.long = el('md-long').value; };
  });
  el('btn-cancel').onclick = closePanel;
  if (!blocked) el('btn-go').onclick = () => startPublish(p);
  body.querySelectorAll('[data-copy]').forEach((b) => {
    b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(b.getAttribute('data-copy')); b.textContent = 'Copied'; };
  });
  wirePkListeners(p);
}

function renderPreflight(p) {
  if (!p.connection) return '<div class="muted">Select a BDC connection to run the checks.</div>';
  if (!p.detail) return '<div class="muted">Waiting for the share contents…</div>';
  if (p.preflightError) return errorBox('Pre-flight failed:', p.preflightError, 'preflight-retry');
  if (!p.preflight || p.preflightRunning) {
    return '<ul class="checklist"><li class="wait"><span class="icon"><span class="loading"></span></span><div>Checking objects, keys, privileges, and app access. Missing access for the app is granted as you.</div></li></ul>';
  }
  const icon = { ok: '✓', warn: '!', fail: '✕' };
  return '<ul class="checklist">' + effectiveChecks(p).map((c) => {
    let extra = '';
    if (c.sql && c.sql.length) {
      const text = c.sql.join(c.fixKind === 'cli' ? '\n' : ';\n') + (c.fixKind === 'cli' ? '' : ';');
      extra = '<div class="copy-block"><pre class="code wrap">' + escHtml(text) + '</pre>' +
        '<button class="btn secondary btn-sm" type="button" data-copy="' + escHtml(text) + '">Copy</button></div>';
    }
    if (c.errors && c.errors.length) {
      extra += '<details><summary>Show errors</summary><pre class="code wrap">' + escHtml(c.errors.join('\n')) + '</pre></details>';
    }
    return '<li class="' + c.status + '"><span class="icon">' + icon[c.status] + '</span><div><div>' + escHtml(c.label) + '</div>' +
      '<div class="detail">' + escHtml(c.detail) + '</div>' + extra + '</div></li>';
  }).join('') + '</ul>' +
  '<button class="btn link btn-sm" id="preflight-retry" type="button">Re-check</button>';
}

// --- Primary key picker -----------------------------------------------------

function renderPkSection(p) {
  if (p.detail.columnsError) {
    return '<div class="section"><h3>Pick primary keys</h3>' +
      errorBox('Couldn\'t read columns and keys from Unity Catalog:', { message: p.detail.columnsError, transient: true }, 'pk-retry') + '</div>';
  }
  const tables = p.detail.tables.filter((t) => t.columnsKnown !== false && !t.hasPrimaryKey);
  if (!tables.length) return '';
  let html = '<div class="section"><h3>Pick primary keys</h3><div class="muted mb-2">These tables have no primary key in Unity Catalog. Pick the key columns and the app adds them to the schema it sends to BDC.</div>';
  tables.forEach((t) => {
    const sel = p.pkSel[t.sharedAs] || [];
    html += '<div class="pk-table ' + (sel.length ? 'defined' : 'missing') + '">' +
      '<div class="pk-table-head"><div class="pk-table-name">' + escHtml(t.sharedAs) + '</div>' +
      '<span class="badge ' + (sel.length ? 'table' : 'view') + '">' + (sel.length ? 'Key: ' + sel.map(escHtml).join(', ') : 'No key') + '</span></div>';
    if (!t.columns || !t.columns.length) {
      html += '<div class="muted mt-2">Column list not visible to you, so a key can\'t be picked here. The table publishes without a key annotation.</div>';
    } else {
      html += renderPkChips(t.sharedAs, sel) + renderPkList(p, t);
    }
    html += '</div>';
  });
  return html + '</div>';
}

function renderPkChips(sharedAs, sel) {
  if (!sel.length) return '<div class="pk-chips"><span class="pk-chips-empty">No key columns selected.</span></div>';
  return '<div class="pk-chips">' + sel.map((c) =>
    '<span class="pk-chip">' + escHtml(c) + '<button type="button" data-pk-remove data-pk-table="' + escHtml(sharedAs) + '" data-pk-col="' + escHtml(c) + '" title="Remove">×</button></span>'
  ).join('') + '</div>';
}

function filteredCols(t, search) {
  const q = (search || '').toLowerCase();
  return q ? t.columns.filter((c) => c.name.toLowerCase().includes(q) || (c.type || '').toLowerCase().includes(q)) : t.columns;
}

function renderPkList(p, t) {
  const ui = p.pkUi[t.sharedAs] || (p.pkUi[t.sharedAs] = { search: '', visible: PK_PAGE_SIZE });
  const sel = p.pkSel[t.sharedAs] || [];
  const filtered = filteredCols(t, ui.search);
  const visible = filtered.slice(0, ui.visible);
  let html = '<div class="pk-search"><input type="text" data-pk-search="' + escHtml(t.sharedAs) + '" placeholder="Search columns…" value="' + escHtml(ui.search) + '" /></div>' +
    '<div class="pk-list" data-pk-list="' + escHtml(t.sharedAs) + '">';
  if (!visible.length) html += '<div class="pk-list-empty">No columns match.</div>';
  visible.forEach((c) => {
    const on = sel.includes(c.name);
    html += '<div class="pk-item ' + (on ? 'selected' : '') + '" data-pk-toggle data-pk-table="' + escHtml(t.sharedAs) + '" data-pk-col="' + escHtml(c.name) + '">' +
      '<span class="col-name">' + escHtml(c.name) + '</span><span class="row">' +
      (c.type ? '<span class="col-type">' + escHtml(c.type) + '</span>' : '') + (on ? '<span class="col-check">✓</span>' : '') + '</span></div>';
  });
  if (filtered.length > visible.length) html += '<div class="pk-list-footer">Showing ' + visible.length + ' of ' + filtered.length + '. Scroll for more.</div>';
  return html + '</div>';
}

function wirePkListeners(p) {
  const body = el('panel-body');
  const toggle = (t, c, remove) => {
    const list = p.pkSel[t] || [];
    const i = list.indexOf(c);
    if (i >= 0) list.splice(i, 1); else if (!remove) list.push(c);
    p.pkSel[t] = list;
    const scroll = el('overlay').scrollTop;
    renderPanel();
    el('overlay').scrollTop = scroll;
  };
  body.querySelectorAll('[data-pk-toggle]').forEach((row) => {
    row.onclick = () => toggle(row.getAttribute('data-pk-table'), row.getAttribute('data-pk-col'), false);
  });
  body.querySelectorAll('[data-pk-remove]').forEach((b) => {
    b.onclick = (ev) => { ev.stopPropagation(); toggle(b.getAttribute('data-pk-table'), b.getAttribute('data-pk-col'), true); };
  });
  body.querySelectorAll('[data-pk-search]').forEach((input) => {
    let timer;
    input.oninput = () => {
      clearTimeout(timer);
      const t = input.getAttribute('data-pk-search');
      timer = setTimeout(() => {
        p.pkUi[t] = { search: input.value, visible: PK_PAGE_SIZE };
        const scroll = el('overlay').scrollTop;
        renderPanel();
        el('overlay').scrollTop = scroll;
        const again = body.querySelector('[data-pk-search="' + CSS.escape(t) + '"]');
        if (again) { again.focus(); const v = again.value; again.value = ''; again.value = v; }
      }, 150);
    };
  });
  body.querySelectorAll('[data-pk-list]').forEach((list) => {
    list.onscroll = () => {
      const t = list.getAttribute('data-pk-list');
      const table = p.detail.tables.find((x) => x.sharedAs === t);
      const ui = p.pkUi[t];
      if (!table || !ui || ui.visible >= filteredCols(table, ui.search).length) return;
      if (list.scrollTop + list.clientHeight >= list.scrollHeight - 24) {
        ui.visible += PK_PAGE_SIZE;
        const top = list.scrollTop; const scroll = el('overlay').scrollTop;
        renderPanel();
        el('overlay').scrollTop = scroll;
        const again = body.querySelector('[data-pk-list="' + CSS.escape(t) + '"]');
        if (again) again.scrollTop = top;
      }
    };
  });
}

// --- Publish run ------------------------------------------------------------

async function startPublish(p) {
  const title = (p.form.title || p.share.name).trim();
  const shortDesc = (p.form.short || '').trim();
  const err = el('md-short-err');
  const showErr = (m) => { err.textContent = m; err.hidden = false; el('md-short').classList.add('invalid'); el('md-short').focus(); };
  // BDC's ORD validation rejects a short description that repeats the title.
  if (!shortDesc) return showErr('Short description is required.');
  if (title && shortDesc.toLowerCase().includes(title.toLowerCase())) return showErr('Short description must not contain the title.');

  p.phase = 'submitting';
  renderPanel();
  try {
    const r = await api('POST', '/api/publish', {
      shareName: p.share.name, recipientName: p.connection, warehouseId: state.wh,
      title, shortDescription: shortDesc, description: (p.form.long || '').trim(),
      primaryKeys: selectedPks(p), republish: p.mode === 'republish',
    });
    p.run = { runId: r.runId, life: 'PENDING' };
    p.phase = 'running';
    renderPanel();
    pollRun(p, '/api/publish/');
  } catch (e) {
    p.phase = 'error'; p.error = e;
    renderPanel();
  }
}

async function pollRun(p, base) {
  if (state.panel !== p) return;
  try {
    const r = await api('GET', base + encodeURIComponent(p.run.runId));
    const life = (r.state && r.state.life_cycle_state) || 'UNKNOWN';
    p.run = { ...p.run, life, result: r.state && r.state.result_state, url: r.runPageUrl, detail: r };
    if (['TERMINATED', 'INTERNAL_ERROR', 'SKIPPED'].includes(life)) {
      if (p.run.result === 'SUCCESS') {
        if (p.mode === 'unpublish') return finalizeUnpublish(p);
        p.phase = 'success';
      } else {
        p.phase = 'failed';
      }
      renderPanel();
      return;
    }
    renderPanel();
    state.pollTimer = setTimeout(() => pollRun(p, base), 3000);
  } catch (e) {
    // A failed poll doesn't mean a failed run. Keep the run id and let the
    // user retry; the server records the outcome either way.
    p.pollError = e;
    renderPanel();
  }
}

function progressHtml(p) {
  const life = p.run ? p.run.life : 'SUBMITTING';
  const phase = p.phase;
  const steps = [['Submitted', 0], ['Running', 1], [p.mode === 'unpublish' ? 'Removed' : 'Published', 2]];
  const idx = phase === 'success' ? 3 : life === 'RUNNING' ? 1 : 0;
  const bar = phase === 'success' ? 'success' : (phase === 'failed' || phase === 'error') ? 'error' : 'indeterminate';
  const link = p.run && p.run.url ? '<a href="' + escHtml(p.run.url) + '" target="_blank">View job run ' + escHtml(p.run.runId) + '</a>' : '';
  return '<div class="progress"><div class="progress-label"><span>' +
    escHtml(phase === 'submitting' ? 'Submitting…' : phase === 'success' ? 'Done' : (phase === 'failed' || phase === 'error') ? 'Failed' : 'Job ' + String(life).toLowerCase() + '…') +
    '</span><span>' + link + '</span></div>' +
    '<div class="progress-bar ' + bar + '"><div class="fill" style="width:' + (idx + 1) * 33 + '%"></div></div>' +
    '<div class="progress-steps">' + steps.map(([label, i]) => {
      let cls = '';
      if (phase === 'success' || i < idx) cls = 'done';
      else if (i === idx && bar === 'indeterminate') cls = 'active';
      else if (bar === 'error' && i <= 1) cls = 'failed';
      return '<div class="progress-step ' + cls + '">' + escHtml(label) + '</div>';
    }).join('') + '</div></div>';
}

function renderRunState(p) {
  let html = '<div class="section">' + progressHtml(p);
  if (p.phase === 'running' || p.phase === 'submitting') {
    html += '<div class="muted">You can close this window. The app records the result in the activity log' +
      (p.mode === 'unpublish' ? ' and finishes the REVOKE the next time you open it.' : '.') + '</div>';
    if (p.pollError) html += errorBox('Lost track of the run:', p.pollError, 'poll-retry');
  }
  if (p.phase === 'error') html += errorBox('Could not start:', p.error);
  if (p.phase === 'failed') html += renderJobError(p.run.detail || {});
  if (p.phase === 'success') {
    if (p.mode === 'unpublish') {
      html += '<div class="msg ok"><strong>Removed from BDC.</strong> <code>' + escHtml(p.share.name) + '</code> is no longer shared with <code>' + escHtml(p.connection) + '</code>. The share itself is unchanged.</div>';
    } else {
      html += '<div class="msg ok"><strong>' + (p.mode === 'republish' ? 'Updated in BDC.' : 'Published to BDC.') + '</strong> <code>' + escHtml(p.share.name) + '</code> → <code>' + escHtml(p.connection) + '</code></div>' +
        '<div class="section"><h3>Next, in SAP</h3><ol class="next-steps">' +
        '<li>Wait a few minutes for the data product to show up in the BDC catalog. If it doesn\'t, run a metadata extraction for this Databricks connection in the BDC cockpit.</li>' +
        '<li>Install or share the data product into the SAP Datasphere space that needs it.</li>' +
        '<li>Build your models on it in Datasphere or SAP Analytics Cloud.</li>' +
        '</ol><div class="muted"><a href="' + SAP_HELP + '" target="_blank" rel="noopener">SAP Business Data Cloud help</a></div></div>';
    }
  }
  if (p.phase === 'finalize_failed') {
    html += '<div class="msg err"><strong>Removed from BDC, but the REVOKE failed:</strong> ' + escHtml(p.error && p.error.message) +
      ' The grant on the share is still in place. The app retries the next time you open it, or use Retry.' +
      ' <button class="btn secondary btn-sm" id="finalize-retry" type="button">Retry</button></div>';
  }
  html += '</div><div class="actions"><button class="btn secondary" id="btn-done" type="button">Close</button></div>';
  return html;
}

function wireRunState(p) {
  el('btn-done').onclick = closePanel;
  const pr = el('poll-retry');
  if (pr) pr.onclick = () => { p.pollError = null; renderPanel(); pollRun(p, p.mode === 'unpublish' ? '/api/unpublish/' : '/api/publish/'); };
  const fr = el('finalize-retry');
  if (fr) fr.onclick = () => finalizeUnpublish(p);
}

function renderJobError(r) {
  const err = r.error || {};
  let html = '<div class="msg err"><strong>' + (state.panel && state.panel.mode === 'unpublish' ? 'Removal failed.' : 'Publish failed.') + '</strong>';
  if (err.message) html += '<div class="mt-2">' + escHtml(err.message) + '</div>';
  else if (r.stateMessage) html += '<div class="mt-2">' + escHtml(r.stateMessage) + '</div>';
  const hint = failureHint(err.message || r.stateMessage || '');
  if (hint) html += '<div class="mt-2">' + hint + '</div>';
  if (err.trace) html += '<details><summary>Show traceback</summary><pre class="code wrap">' + escHtml(String(err.trace).trim()) + '</pre></details>';
  if (err.logs) html += '<details><summary>Show logs' + (err.logsTruncated ? ' (truncated)' : '') + '</summary><pre class="code wrap">' + escHtml(err.logs) + '</pre></details>';
  return html + '</div>';
}

function failureHint(msg) {
  const m = String(msg).toLowerCase();
  if (m.includes('secret does not exist') || m.includes('secret scope')) return 'The SDK secret scope is missing. See <a href="/faq.html#secret-scope">FAQ: secret scope</a>.';
  if (m.includes('permission') || m.includes('privilege')) return 'A permission is missing. See <a href="/faq.html#privileges">FAQ: privileges</a>.';
  if (m.includes('primary key')) return 'See <a href="/faq.html#primary-keys">FAQ: primary keys</a>.';
  return '';
}

// --- Unpublish --------------------------------------------------------------

function renderUnpublish(p) {
  let html = '<h2 id="panel-title">Unpublish from SAP BDC</h2><div class="muted">Share <code>' + escHtml(p.share.name) + '</code></div>';
  if (p.phase !== 'form') return html + renderRunState(p);
  return html +
    '<div class="section"><div class="msg warn">This removes <code>' + escHtml(p.share.name) + '</code> from the BDC connection <code>' + escHtml(p.connection) + '</code>:' +
    '<ul><li>In BDC: the data product, its metadata and schema are deleted.</li>' +
    '<li>In Databricks: once BDC confirms, <code>SELECT</code> is revoked from the connection. The share and its tables stay as they are.</li></ul>' +
    'SAP consumers lose access to this data.</div></div>' +
    '<div class="actions"><button class="btn danger" id="btn-unpublish" type="button">Unpublish</button>' +
    '<button class="btn secondary" id="btn-cancel" type="button">Cancel</button></div>';
}

function wireUnpublish(p) {
  if (p.phase !== 'form') return wireRunState(p);
  el('btn-cancel').onclick = closePanel;
  el('btn-unpublish').onclick = async () => {
    p.phase = 'submitting';
    renderPanel();
    try {
      const r = await api('POST', '/api/unpublish', { shareName: p.share.name, recipientName: p.connection, warehouseId: state.wh });
      p.run = { runId: r.runId, life: 'PENDING' };
      p.phase = 'running';
      renderPanel();
      pollRun(p, '/api/unpublish/');
    } catch (e) {
      p.phase = 'error'; p.error = e;
      renderPanel();
    }
  };
}

async function finalizeUnpublish(p) {
  p.phase = 'running';
  p.run.life = 'REVOKING';
  renderPanel();
  try {
    await api('POST', '/api/unpublish/' + encodeURIComponent(p.run.runId) + '/finalize', {
      shareName: p.share.name, recipientName: p.connection, warehouseId: state.wh,
    });
    p.phase = 'success';
  } catch (e) {
    p.phase = 'finalize_failed'; p.error = e;
  }
  if (state.panel === p) renderPanel();
}
</script>
